[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "betting-intel"
version = "0.3.0"
description = "Basketball betting intelligence — market inefficiency detection, live predictions, and web dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Betting Intelligence Team"}
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "SQLAlchemy>=2.0",
    "click>=8.1",
    "httpx>=0.26",
    "playwright>=1.54",
    "playwright-stealth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
betting-intel = "betting_intel.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["betting_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
