version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betting-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      API_KEY: ${API_KEY:-change-me}
    ports:
      - "8000:8000"
