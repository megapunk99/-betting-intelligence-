# ═══════════════════════════════════════════════════════════════════════════
# Alembic Configuration — Betting Intelligence System
# ═══════════════════════════════════════════════════════════════════════════
#
# Database URL is resolved at runtime by alembic/env.py from the project's
# settings (pydantic-settings, which reads from .env).
#
# Usage:
#   alembic upgrade head     — Apply all pending migrations
#   alembic downgrade -1     — Roll back one migration
#   alembic revision --autogenerate -m "description"  — Create new migration
#
# Reference: https://alembic.sqlalchemy.org/en/latest/
# ═══════════════════════════════════════════════════════════════════════════

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Template used for new migration files
file_template = %%(rev)s_%%(slug)s

# Output encoding for migration files
output_encoding = utf-8

# SQLAlchemy URL — overridden by env.py at runtime to use
# the project's DATABASE_URL from settings / .env
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
