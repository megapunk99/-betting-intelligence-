{% extends "base.html" %}
{% block title %}All Bets{% endblock %}

{% block content %}
<!-- ═══ HEADER ═══ -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 fade-in">
  <div>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-white flex items-center gap-3">
      <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500/20 to-purple-500/20 border border-blue-500/10">
        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </span>
      All Bets
    </h1>
    <p class="text-sm text-gray-500 mt-1.5">{{ total }} bets ranked by edge</p>
  </div>
  <div class="flex items-center gap-3">
    <div class="glass-card rounded-xl px-4 py-2.5 text-center">
      <div class="text-lg font-bold text-accent-400">{{ total }}</div>
      <div class="text-[0.55rem] text-gray-500 uppercase tracking-wider">Bets</div>
    </div>
  </div>
</div>

<!-- ═══ FILTERS ═══ -->
<div class="glass-card rounded-2xl p-5 mb-8 fade-in" id="bet-filters">
  <div class="flex flex-wrap items-center gap-4">
    <select class="filter-select" name="league"
            hx-get="/all-bets" hx-target="#bets-table" hx-trigger="change" hx-include="closest #bet-filters">
      <option value="all" {% if selected_league == 'all' %}selected{% endif %}>All Leagues</option>
      {% for l in leagues %}
      <option value="{{ l }}" {% if selected_league == l %}selected{% endif %}>{{ l }}</option>
      {% endfor %}
    </select>

    <select class="filter-select" name="bet_type"
            hx-get="/all-bets" hx-target="#bets-table" hx-trigger="change" hx-include="closest #bet-filters">
      <option value="all" {% if selected_type == 'all' %}selected{% endif %}>All Types</option>
      {% for t in types %}
      <option value="{{ t }}" {% if selected_type == t %}selected{% endif %}>{{ t.replace('_', ' ') | title }}</option>
      {% endfor %}
    </select>

    <select class="filter-select" name="sort_by"
            hx-get="/all-bets" hx-target="#bets-table" hx-trigger="change" hx-include="closest #bet-filters">
      <option value="edge" {% if sort_by == 'edge' %}selected{% endif %}>Sort by Edge</option>
      <option value="stake" {% if sort_by == 'stake' %}selected{% endif %}>Sort by Stake</option>
      <option value="confidence" {% if sort_by == 'confidence' %}selected{% endif %}>Sort by Confidence</option>
    </select>

    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-500 font-medium">Min Edge</span>
      <input type="range" name="min_edge" min="0" max="10" step="0.5" value="{{ (min_edge * 100)|int }}"
             class="w-24 h-1.5 rounded-full appearance-none bg-dark-600 accent-accent-400 cursor-pointer"
             hx-get="/all-bets" hx-target="#bets-table" hx-trigger="change" hx-include="closest #bet-filters"
             oninput="document.getElementById('ab-edge-val').textContent = this.value + '%'">
      <span class="text-xs text-gray-400 font-mono font-semibold" id="ab-edge-val">{{ (min_edge * 100)|int }}%</span>
    </div>

    <div class="ml-auto text-xs text-gray-500">
      <span class="text-white font-semibold">{{ total }}</span> bets
    </div>
  </div>
</div>

<!-- ═══ BETS TABLE ═══ -->
<div id="bets-table">
  {% include "partials/bets_table.html" %}
</div>
{% endblock %}
