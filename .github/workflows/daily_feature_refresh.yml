name: Daily Feature Refresh

on:
  schedule:
    # Run daily at 6:00 AM UTC (after all NBA games from the night before)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-features:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Restore NBA database from seed workflow cache so the feature
      # refresh and model retraining can load real game data.
      - name: Restore NBA database cache
        uses: actions/cache@v4
        with:
          path: data/nba_data.db
          key: nba-data-test-${{ github.sha }}
          restore-keys: |
            nba-data-

      - name: Check database has game data
        id: db-check
        run: |
          python tools/check_db.py --min-rows 50 && echo "has_data=true" >> "$GITHUB_OUTPUT" || echo "has_data=false" >> "$GITHUB_OUTPUT"

      - name: Run feature refresh
        if: steps.db-check.outputs.has_data == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
        run: |
          python tools/daily_refresh.py --mode build-features

      - name: Skip — no NBA database available
        if: steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Feature refresh skipped — NBA database not available. Run ci-seed-database.yml first or trigger after the nightly seed."

      - name: Run model retraining
        if: steps.db-check.outputs.has_data == 'true'
        run: |
          python tools/retrain_all.py --mode weekly

      - name: Skip model retraining — no NBA database available
        if: steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Model retraining skipped — NBA database not available."

      - name: Resolve predictions against actual results
        if: steps.db-check.outputs.has_data == 'true'
        run: |
          betting-intel analytics resolve

      - name: Check for underperforming strategies
        if: steps.db-check.outputs.has_data == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_ALERT_TO: ${{ secrets.SMTP_ALERT_TO }}
        run: |
          betting-intel analytics check-alerts

      - name: Post P&L summary to workflow run page
        if: steps.db-check.outputs.has_data == 'true'
        run: |
          betting-intel analytics summary >> "$GITHUB_STEP_SUMMARY"

      - name: Skip analytics — no NBA database available
        if: steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Analytics resolve skipped — NBA database not available."

      - name: Run validation checks
        run: |
          python tools/daily_refresh.py --mode validate-checks

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/*.pkl
            output/models/*.pkl
          retention-days: 30
