name: Weekly Model Retraining

on:
  schedule:
    # Run every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrain-models:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Restore NBA database from seed workflow cache so the retraining
      # script can load real game data via NBADataLoader.
      - name: Restore NBA database cache
        uses: actions/cache@v4
        with:
          path: data/nba_data.db
          key: nba-data-test-${{ github.sha }}
          restore-keys: |
            nba-data-

      - name: Retrain models (total + spread)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python tools/retrain_all.py --mode weekly

      - name: Upload retrained models
        uses: actions/upload-artifact@v4
        with:
          name: retrained-models-weekly-${{ github.run_id }}
          path: models/*.pkl
          retention-days: 90

      # ── Slow-test validation (only on manual trigger) ────────────────
      # Note: NBA database is already restored at the top of this job.
      - name: Validate — check database has game data
        id: db-check
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/check_db.py --min-rows 50 && echo "has_data=true" >> "$GITHUB_OUTPUT" || echo "has_data=false" >> "$GITHUB_OUTPUT"

      - name: Validate — run slow tests on freshly retrained models
        if: github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data == 'true'
        run: |
          pytest -v \
            --tb=short \
            -m "slow" \
            --durations=0 \
            tests/ \
            2>&1 | tee slow-test-output.txt

      - name: Validate — skip (no NBA database)
        if: github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Slow tests skipped — NBA database not available. Run ci-seed-database.yml first or trigger weekly retraining after the nightly seed."

      - name: Validate — upload test output on failure
        if: failure() && github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-output-weekly-retrain
          path: slow-test-output.txt
          retention-days: 30
