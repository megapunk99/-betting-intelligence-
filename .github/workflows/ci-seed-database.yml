name: Seed NBA Database

on:
  schedule:
    # Run daily at 3:00 AM UTC (1 hour before slow-tests workflow)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger to refresh data

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  seed-database:
    name: Seed NBA Database
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"  # Includes nba-api>=1.4 for populate_nba_data.py

      - name: Populate NBA database from nba_api
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python scripts/populate_nba_data.py 2>&1

      - name: Verify database contents
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          import sqlite3
          from betting_intel.config import DB_PATH
          conn = sqlite3.connect(str(DB_PATH))
          count = conn.execute('SELECT COUNT(*) FROM game_logs').fetchone()[0]
          games = count // 2
          date_range = conn.execute('SELECT MIN(GAME_DATE), MAX(GAME_DATE) FROM game_logs').fetchone()
          teams = conn.execute('SELECT COUNT(DISTINCT TEAM_NAME) FROM game_logs').fetchone()[0]
          conn.close()
          print(f'Database: {count} rows ({games} games)')
          print(f'Teams: {teams}')
          print(f'Date range: {date_range[0]} to {date_range[1]}')
          if games < 50:
              print('::warning::Too few games seeded — slow tests may not have enough data')
              exit(1)
          print('Database seeded successfully!')
          "

      - name: Cache NBA database for slow-tests workflow
        uses: actions/cache@v4
        with:
          path: data/nba_data.db
          # The slow-tests workflow restores with nba-data- prefix,
          # which matches this key. ~21 MB per day accumulates to
          # ~7.7 GB/year — well under GitHub's 10 GB limit.
          key: nba-data-${{ github.run_id }}
          restore-keys: |
            nba-data-

      - name: Export database as artifact (for first restore / manual download)
        uses: actions/upload-artifact@v4
        with:
          name: nba-database
          path: data/nba_data.db
          # Artifacts are faster to download than running the seed from scratch
          # on the first CI run (cache miss). The slow-tests workflow prefers
          # the cache (faster), but the artifact is a fallback.
          # Note: compression-level was removed in upload-artifact@v4.
          # v4 streams files without additional compression.
          retention-days: 7
          if-no-files-found: error

      - name: Display cache info
        run: |
          ls -lh data/nba_data.db
          echo "Cache key: nba-data-${{ github.run_id }}"
          echo "Artifact: nba-database (retained 7 days)"
