name: Slow Tests (Nightly)

on:
  schedule:
    # Run nightly at 4:00 AM UTC (1 hour after ci-seed-database.yml seeds the DB)
    - cron: '0 4 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  push:
    branches: [main, master]
    paths:
      # Wide trigger: any change to core modules or slow tests
      - 'src/betting_intel/models/**'
      - 'src/betting_intel/recommendations/**'
      - 'src/betting_intel/data/**'
      - 'src/betting_intel/backtesting/**'
      - 'src/betting_intel/betting/**'
      - 'src/betting_intel/features/**'
      - 'src/betting_intel/validation/**'
      - 'tests/test_recommendations.py'
      - 'tests/test_validation.py'
      - 'main.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-tests:
    name: Slow Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore NBA database from seed workflow cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: data/nba_data.db
          # Restore the latest cache saved by ci-seed-database.yml.
          # The seed saves with key nba-data-<run_id>, and the
          # nba-data- prefix matches the most recent one.
          key: nba-data-test-${{ github.sha }}
          restore-keys: |
            nba-data-

      - name: Check database has game data
        id: db-check
        run: |
          python tools/check_db.py --min-rows 50 && echo "has_data=true" >> "$GITHUB_OUTPUT" || echo "has_data=false" >> "$GITHUB_OUTPUT"

      - name: Run slow tests with timing breakdown
        if: steps.db-check.outputs.has_data == 'true'
        run: |
          pytest -v \
            --tb=short \
            -m "slow" \
            --durations=0 \
            tests/ \
            2>&1 | tee slow-test-output.txt

      - name: Skip — no NBA database available
        if: steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Slow tests skipped — NBA database not available. Run the ci-seed-database.yml workflow first to populate the database cache, or trigger workflow_dispatch on this workflow after the seed completes."

      - name: Upload test output on failure
        if: failure() && steps.db-check.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-output-${{ matrix.os }}-${{ matrix.python-version }}
          path: slow-test-output.txt
          retention-days: 30

      - name: Annotate on scheduled failure
        if: failure() && github.event_name == 'schedule' && steps.db-check.outputs.has_data == 'true'
        run: |
          echo "::warning::Slow tests failed on ${{ matrix.os }} (Python ${{ matrix.python-version }}). Check the workflow logs for details."
