name: Monthly Full Retraining

on:
  schedule:
    # Run on the 1st of every month at 10:00 AM UTC
    - cron: '0 10 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install matplotlib seaborn  # For report generation

      # Restore NBA database from seed workflow cache so the retraining
      # script can load real game data via NBADataLoader.
      - name: Restore NBA database cache
        uses: actions/cache@v4
        with:
          path: data/nba_data.db
          key: nba-data-test-${{ github.sha }}
          restore-keys: |
            nba-data-

      - name: Backup current models
        run: |
          mkdir -p models/backup
          cp models/*.pkl models/backup/ 2>/dev/null || echo "No existing models to backup"

      - name: Retrain all models (total + spread + win prob)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
        run: python tools/retrain_all.py --mode monthly

      - name: Run calibration check
        run: python -c "from betting_intel.validation.calibration import ProbabilityCalibrator, PlattCalibrator, IsotonicCalibrator; print('Calibration modules verified')"

      - name: Generate retraining report
        run: |
          echo '# Retraining Report' > report.md
          echo "## Date: $(date)" >> report.md
          echo "## Status: Complete" >> report.md
          echo "## Models Retrained" >> report.md
          echo "- Total Points Model" >> report.md
          echo "- Spread Model" >> report.md
          echo "- Win Probability Model" >> report.md
          echo "- Calibrated Models" >> report.md

      - name: Upload report and models
        uses: actions/upload-artifact@v4
        with:
          name: monthly-retrain-${{ github.run_id }}
          path: |
            models/*.pkl
            report.md
          retention-days: 90

      # ── Slow-test validation (only on manual trigger) ────────────────
      # Note: NBA database is already restored at the top of this job.
      - name: Validate — check database has game data
        id: db-check
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/check_db.py --min-rows 50 && echo "has_data=true" >> "$GITHUB_OUTPUT" || echo "has_data=false" >> "$GITHUB_OUTPUT"

      - name: Validate — run slow tests on freshly retrained models
        if: github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data == 'true'
        run: |
          pytest -v \
            --tb=short \
            -m "slow" \
            --durations=0 \
            tests/ \
            2>&1 | tee slow-test-output.txt

      - name: Validate — skip (no NBA database)
        if: github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data != 'true'
        run: |
          echo "::notice::Slow tests skipped — NBA database not available. Run ci-seed-database.yml first or trigger monthly retraining after the nightly seed."

      - name: Validate — upload test output on failure
        if: failure() && github.event_name == 'workflow_dispatch' && steps.db-check.outputs.has_data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slow-test-output-monthly-retrain
          path: slow-test-output.txt
          retention-days: 30
