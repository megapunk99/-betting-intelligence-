# ═══════════════════════════════════════════════════════════════════════════
#  Pytest Configuration — Betting Intelligence System
# ═══════════════════════════════════════════════════════════════════════════
#  Usage:
#    pytest
#    pytest -v
#    pytest --cov=src/betting_intel --cov-report=term-missing
#    pytest --cov --cov-report=html
#    pytest -k "not slow"
# ═══════════════════════════════════════════════════════════════════════════

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    slow: Marks tests as slow (e.g., model training). Use -k "not slow" to skip.
    integration: Tests that require external services or a database.
    unit: Fast unit tests that run in isolation.
    model: Tests for ML model training and inference.
    web: Tests for API/web endpoints.

log_cli = false
log_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
